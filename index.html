<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity WebGL | VendettaRouge</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: black;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        width: 800px;
        height: 720px;
        background: black;
        outline: none;
        border: none;
        box-shadow: 0 0 20px red;
      }

      #unity-loading-bar {
        position: absolute;
        width: 100%;
        top: 50%;
        transform: translateY(-50%);
        text-align: center;
        color: white;
      }

      #unity-warning {
        color: red;
        padding: 10px;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="0"></canvas>
    </div>
    <div id="unity-loading-bar">
      <div id="unity-logo">Loading...</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>

    <script>
      const canvas = document.getElementById("unity-canvas");
      canvas.addEventListener("click", () => canvas.focus()); // Ensures keyboard/mouse input

      function unityShowBanner(msg, type) {
        const warning = document.getElementById("unity-warning");
        warning.innerText = msg;
        warning.style.display = "block";
        if (type === 'error') {
          warning.style.background = 'red';
        } else {
          warning.style.background = 'yellow';
          setTimeout(() => { warning.style.display = 'none'; }, 5000);
        }
      }

      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/web.data.unityweb",
        frameworkUrl: buildUrl + "/web.framework.js.unityweb",
        codeUrl: buildUrl + "/web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "VendettaRouge",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      const loaderScript = document.createElement("script");
      loaderScript.src = buildUrl + "/web.loader.js";
      loaderScript.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.getElementById("unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.getElementById("unity-loading-bar").style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>
